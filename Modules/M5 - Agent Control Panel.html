<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>M5 — Agent Control Panel</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap');@import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap');@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap');
:root{--bg:#07162C;--fg:#e8e8f0;--muted:#8899bb;--accent:#60a5fa;--accent2:#79c0ff;--card:#0c2244;--line:rgba(255,255,255,0.08);--ok:#6ee7b7;--warn:#e3b341;--brand:#1241B0}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif}
  header{padding:24px 32px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
  header h1{margin:0;font-size:22px}
  .crumb{color:var(--muted);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
  main{max-width:1200px;margin:0 auto;padding:24px 32px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  button{background:var(--brand);color:#fff;border:0;border-radius:999px;padding:10px 20px;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(18,65,176,0.32)}
  button.secondary{background:transparent;color:var(--fg);border:1px solid var(--line)}
  .lever{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 22px;margin-bottom:14px}
  .lever h2{margin:0 0 4px;font-size:18px;color:var(--accent2)}
  .lever p.q{margin:0 0 12px;color:var(--muted);font-size:14px}
  textarea{width:100%;background:rgba(18,65,176,0.08);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;font-size:14px;min-height:60px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  textarea:focus{outline:2px solid var(--accent);border-color:var(--accent)}
  .preview{background:rgba(18,65,176,0.08);border:1px solid var(--line);border-radius:10px;padding:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.55;white-space:pre-wrap;color:#d5dbea;margin-top:12px}
  .toast{position:fixed;bottom:18px;right:18px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;color:var(--ok);font-size:13px;display:none}
  .toast.show{display:block}
</style>
</head>
<body>
<header>
  <div><div class="crumb">Module 5 · Tool</div><h1>Agent Control Panel</h1></div>
  <div class="row">
    <button onclick="copyMd()">Copy as markdown</button>
    <button class="secondary" onclick="download()">Download .md</button>
    <button class="secondary" onclick="reset()">Reset</button>
  </div>
</header>
<main>
  <p style="color:var(--muted);font-size:14px;margin-top:0">Five levers. Declare the minimum viable rule for each. Export to <code>05-agentic-workflows/agent-control-panel.md</code>.</p>
  <div id="levers"></div>
  <h2 style="margin-top:24px;font-size:16px;color:var(--accent2);letter-spacing:.14em;text-transform:uppercase">Preview</h2>
  <div class="preview" id="preview"></div>
</main>
<div class="toast" id="toast">Copied</div>
<script>
  const L=[
    {id:'trig',name:'Triggers',q:'When does the agent activate?',ph:'On new P0-tagged thread in #escalations with ≥5 messages in 10 min.'},
    {id:'tool',name:'Tools',q:'What can it call? Scope each.',ph:'slack.read (read-only), corpus.retrieve (read-only), jira.create_stub (write, ≥80% confidence), slack.post (write, #pm-daily only).'},
    {id:'mem',name:'Memory scope',q:'What does it remember, for how long?',ph:'Short-term: yes. Long-term: no. Episodic: 30 days. Semantic: weekly refresh.'},
    {id:'stop',name:'Stop conditions',q:'When does it hand back / shut down?',ph:'Success after top-3 posted; failure after 2 tool errors; escalate <70% confidence; timeout 90s.'},
    {id:'obs',name:'Observability',q:'What logs, traces, eval surface?',ph:'Trace ID, retrieved chunks, tool calls, confidence, PM action, latency, cost.'},
  ];
  const KEY='m5-control-panel';
  function load(){const s=localStorage.getItem(KEY);return s?JSON.parse(s):{}}
  function save(s){localStorage.setItem(KEY,JSON.stringify(s))}
  let state=load();
  function render(){
    const root=document.getElementById('levers');root.innerHTML='';
    L.forEach(l=>{
      const div=document.createElement('div');div.className='lever';
      div.innerHTML=`<h2>${l.name}</h2><p class="q">${l.q}</p><textarea id="t_${l.id}" placeholder="${l.ph}">${state[l.id]||''}</textarea>`;
      root.appendChild(div);
      document.getElementById('t_'+l.id).addEventListener('input',e=>{state[l.id]=e.target.value;save(state);preview()});
    });
    preview();
  }
  function md(){
    let s='# Juno PM — Agent Control Panel\n\n_Companion to `awspec.md`. Committed to `05-agentic-workflows/agent-control-panel.md`._\n\n| Lever | Rule |\n|---|---|\n';
    L.forEach(l=>{s+=`| ${l.name} | ${(state[l.id]||'_(missing)_').replace(/\|/g,'\\|').replace(/\n/g,' ')} |\n`});
    return s;
  }
  function preview(){document.getElementById('preview').textContent=md()}
  function copyMd(){navigator.clipboard.writeText(md()).then(()=>{const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1400)})}
  function download(){const b=new Blob([md()],{type:'text/markdown'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='agent-control-panel.md';a.click();URL.revokeObjectURL(u)}
  function reset(){if(confirm('Clear all?')){state={};save(state);render()}}
  render();
</script>
</body>
</html>
